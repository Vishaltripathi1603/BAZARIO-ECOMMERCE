<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="g_water-resistant-duffle-bags" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#134E4A" />
    </linearGradient>
    <pattern id="grid_water-resistant-duffle-bags" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Gradient -->
  <rect width="600" height="450" fill="url(#g_water-resistant-duffle-bags)" />
  <!-- Pattern Grid -->
  <rect width="600" height="450" fill="url(#grid_water-resistant-duffle-bags)" />

  <!-- Geometric Abstract 3D Shapes -->
  <g transform="translate(300, 190)">
    <!-- Base Glow -->
    <circle cx="0" cy="0" r="100" fill="rgba(255,255,255,0.12)" filter="blur(20px)" />
    <!-- Isometric Cube / Cylinder -->
    <path d="M 0 -60 L 65 -22 L 65 50 L 0 88 L -65 50 L -65 -22 Z" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" />
    <path d="M 0 -60 L 65 -22 L 0 15 L -65 -22 Z" fill="rgba(255,255,255,0.3)" />
    <path d="M 0 15 L 0 88" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" />
    <!-- Modern Accent Star -->
    <circle cx="0" cy="15" r="7" fill="#F59E0B" />
  </g>

  <!-- Category Department Pill -->
  <rect x="36" y="36" width="129" height="28" rx="14" fill="rgba(0,0,0,0.3)" />
  <text x="51" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="0.8">FASHION MEN</text>

  <!-- Title Bottom Card -->
  <rect x="24" y="340" width="552" height="86" rx="20" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.15)" />
  <text x="46" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Water-Resistant Duffle Bags</text>
  <text x="46" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Curated Marketplace Selection • 100% Quality Assured</text>
</svg>